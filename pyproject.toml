[project]
name = "kernel-arjun"
version = "0.2.0"
description = "The durable-execution kernel for long-horizon AI agents — state that survives restarts, budgets that are law, completion that is verified."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quantum Thoughter", email = "quantum@murugan.ai" }]
keywords = [
  "agents", "long-horizon", "durable-execution", "autonomous-agents",
  "llm", "orchestration", "mcp", "verification", "postgres",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pyyaml>=6",
  "rich>=13",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["mcp>=1.0", "fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://murugan.ai"
Source = "https://github.com/quantumthoughter/kernel-arjun"

[project.scripts]
arjun = "arjun.cli:main"
arjun-mcp = "arjun.mcp_server:main"
arjun-dashboard = "arjun.dashboard:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arjun*"]

[tool.setuptools.package-data]
arjun = ["schema.sql"]
